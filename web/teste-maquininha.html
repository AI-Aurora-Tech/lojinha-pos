<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teste da maquininha - Lojinha GESCS</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0; padding: 16px; background: #f4f4f4; color: #222; }
    h2 { margin: 0 0 4px; }
    .card { background: #fff; border-radius: 10px; padding: 14px; margin: 12px 0; }
    label { display: block; font-size: 15px; margin: 8px 0 4px; }
    input, select { font-size: 22px; padding: 10px; width: 100%; }
    button { font-size: 20px; padding: 16px; width: 100%; margin: 6px 0; border: 0; border-radius: 8px; background: #1b6b3a; color: #fff; }
    button.sec { background: #555; }
    button.perigo { background: #b3261e; }
    button:disabled { opacity: .5; }
    #status { font-size: 14px; color: #555; }
    pre { white-space: pre-wrap; word-break: break-word; font-size: 13px; background: #eee; padding: 8px; border-radius: 6px; }
    #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); color: #fff; padding: 24px;
               flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    #overlay.ativo { display: flex; }
    #mensagemMaquina { font-size: 28px; font-weight: bold; margin: 24px 0; min-height: 2.4em; }
  </style>
</head>
<body>
  <h2>Teste da maquininha</h2>
  <div id="status">Verificando terminal...</div>

  <div class="card">
    <label for="valor">Valor (R$)</label>
    <input id="valor" inputmode="decimal" value="1,00" />

    <label for="metodo">Método</label>
    <select id="metodo">
      <option value="credito">Crédito</option>
      <option value="debito">Débito</option>
      <option value="pix">PIX</option>
      <option value="voucher">Voucher (vale)</option>
    </select>

    <div id="blocoParcelas">
      <label for="parcelamento">Juros do parcelado</label>
      <select id="parcelamento">
        <option value="vendedor">Sem juros para o cliente (loja paga)</option>
        <option value="comprador">Com juros (cliente paga)</option>
      </select>

      <label for="parcelas">Parcelas</label>
      <select id="parcelas"><option value="1">1x</option></select>
    </div>

    <button id="btnCobrar">Concluir venda</button>
  </div>

  <div class="card">
    <button class="perigo" id="btnEstornar" disabled>Estornar última venda deste teste</button>
    <button class="sec" id="btnViaCliente">Reimprimir via do cliente</button>
    <button class="sec" id="btnViaLoja">Reimprimir via do estabelecimento</button>
    <button class="sec" id="btnUltima">Consultar última transação aprovada</button>
  </div>

  <div class="card">
    <strong>Resultado</strong>
    <pre id="log">—</pre>
  </div>

  <div id="overlay">
    <div>Siga as instruções na maquininha</div>
    <div id="mensagemMaquina">Enviando para a maquininha...</div>
    <button class="perigo" id="btnCancelar" style="max-width: 360px">Cancelar cobrança</button>
  </div>

  <!-- Simulador: só age no navegador do PC; dentro da maquininha ele não faz nada. -->
  <script src="mock-android-pagamento.js"></script>
  <script type="module">
    import {
      cobrar, cancelarCobranca, estornar, reimprimir, ultimaTransacao,
      verificarTerminal, aoEventoMaquininha, calcularParcelas,
    } from "./pagamento.js";

    const $ = (id) => document.getElementById(id);
    let ultimaVenda = null;

    function mostrar(titulo, obj) {
      $("log").textContent = titulo + "\n" + JSON.stringify(obj, null, 2);
    }

    const reais = (c) => "R$ " + (c / 100).toFixed(2).replace(".", ",");
    const valorEmCentavos = () => Math.round(parseFloat($("valor").value.replace(/\./g, "").replace(",", ".")) * 100) || 0;

    // Atualiza as opções de parcelas (com o valor de cada uma) quando muda valor/método/juros.
    let pedidoParcelas = 0;
    async function atualizarParcelas() {
      const credito = $("metodo").value === "credito";
      $("blocoParcelas").style.display = credito ? "" : "none";
      const valor = valorEmCentavos();
      const select = $("parcelas");
      const meu = ++pedidoParcelas;
      if (!credito || valor < 1000) {
        select.innerHTML = '<option value="1">1x</option>';
        return;
      }
      try {
        const opcoes = await calcularParcelas(valor, $("parcelamento").value);
        if (meu !== pedidoParcelas) return; // chegou resposta de um valor antigo
        const escolhida = select.value; // mantém a escolha da vendedora se ainda existir
        select.innerHTML = opcoes
          .map((o) => `<option value="${o.parcelas}">${o.parcelas}x de ${reais(o.valorParcelaCentavos)}` +
            (o.totalCentavos !== valor ? ` (total ${reais(o.totalCentavos)})` : "") + "</option>")
          .join("");
        if (opcoes.some((o) => String(o.parcelas) === escolhida)) select.value = escolhida;
      } catch (e) {
        console.warn("parcelas:", e.message);
      }
    }
    ["valor", "metodo", "parcelamento"].forEach((id) => $(id).addEventListener("change", atualizarParcelas));
    atualizarParcelas();

    aoEventoMaquininha((mensagem) => {
      if (mensagem) $("mensagemMaquina").textContent = mensagem;
    });

    verificarTerminal()
      .then((t) => {
        $("status").textContent =
          (t.modelo || "Terminal") + " • série " + (t.serial || "?") + " • " +
          (t.autenticado ? "autenticado ✅" : "NÃO autenticado ⚠️ (ative a maquininha)");
      })
      .catch((e) => ($("status").textContent = e.message));

    $("btnCobrar").onclick = async () => {
      const valorCentavos = valorEmCentavos();
      const metodo = $("metodo").value;
      const parcelas = metodo === "credito" ? Number($("parcelas").value) : 1;
      const parcelamento = $("parcelamento").value;
      const referencia = "T" + Date.now().toString().slice(-9); // até 10 caracteres

      $("mensagemMaquina").textContent = "Enviando para a maquininha...";
      $("overlay").classList.add("ativo");
      try {
        const r = await cobrar({ valorCentavos, metodo, parcelas, parcelamento, referencia });
        if (r.aprovado) {
          ultimaVenda = r;
          $("btnEstornar").disabled = false;
        }
        mostrar(r.aprovado ? "✅ APROVADO" : "❌ " + r.dica, r);
      } catch (e) {
        mostrar("Erro", { mensagem: e.message });
      } finally {
        $("overlay").classList.remove("ativo");
      }
    };

    $("btnCancelar").onclick = () => {
      $("mensagemMaquina").textContent = "Cancelando...";
      cancelarCobranca();
    };

    $("btnEstornar").onclick = async () => {
      if (!ultimaVenda || !confirm("Estornar a venda " + ultimaVenda.codigoTransacao + "?")) return;
      $("overlay").classList.add("ativo");
      try {
        const r = await estornar(ultimaVenda);
        if (r.aprovado) { ultimaVenda = null; $("btnEstornar").disabled = true; }
        mostrar(r.aprovado ? "✅ ESTORNO APROVADO" : "❌ ESTORNO NÃO APROVADO: " + r.dica, r);
      } catch (e) {
        mostrar("Erro", { mensagem: e.message });
      } finally {
        $("overlay").classList.remove("ativo");
      }
    };

    const acao = (fn, titulo) => async () => {
      try { mostrar(titulo, await fn()); } catch (e) { mostrar("Erro", { mensagem: e.message }); }
    };
    $("btnViaCliente").onclick = acao(() => reimprimir("cliente"), "Reimpressão via cliente");
    $("btnViaLoja").onclick = acao(() => reimprimir("estabelecimento"), "Reimpressão via estabelecimento");
    $("btnUltima").onclick = acao(ultimaTransacao, "Última transação aprovada");
  </script>
</body>
</html>
