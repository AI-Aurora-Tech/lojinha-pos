plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'br.org.gescs.lojinha'
    compileSdk 34

    defaultConfig {
        // applicationId == packageName. Não altere depois de publicar (exige nova homologação).
        applicationId "br.org.gescs.lojinha"
        minSdk 23       // mínimo exigido pelo PlugPagServiceWrapper
        targetSdk 28    // conservador para o Android das maquininhas
        versionCode 1
        versionName "1.0.0"

        // Página do GESCS que esta maquininha abre (definida em gradle.properties).
        resValue "string", "url_sistema", project.findProperty("urlSistema") ?: "https://gescs.vercel.app/maquininha"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            // Empacota também a pasta web/ (pagamento.js e a tela teste-maquininha.html).
            assets.srcDirs = ['src/main/assets', '../web']
        }
    }
}

dependencies {
    // Serve a UI web (build do Vite/React) a partir de app/src/main/assets
    // via https://appassets.androidplatform.net — evita os bloqueios de file://.
    implementation 'androidx.webkit:webkit:1.8.0'

    // SDK de pagamento embarcado na Moderninha Smart (PlugPag).
    // Versão mais recente em https://github.com/pagseguro/PlugPagServiceWrapper
    // Mesma versão usada pelo app de exemplo oficial (SmartCoffee).
    implementation 'br.com.uol.pagseguro.plugpagservice.wrapper:wrapper:1.35.0'
}
